name: Deploy Agda HTML to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'regcat-normal-form.agda-lib'
      - '.github/workflows/deploy-html.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout agda-stdlib 2.3
        uses: actions/checkout@v4
        with:
          repository: agda/agda-stdlib
          ref: v2.3
          path: agda-stdlib

      - name: Setup GHC
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8.4'
          cabal-version: '3.12'

      - name: Cache Cabal packages
        uses: actions/cache@v4
        with:
          path: ~/.cabal/store
          key: cabal-${{ runner.os }}-ghc9.8.4-agda2.9.0
          restore-keys: cabal-${{ runner.os }}-ghc9.8.4-

      - name: Install Agda 2.9.0
        run: |
          cabal update
          cabal install Agda-2.9.0 -f optimise-heavily -j

      - name: Register the standard library
        run: |
          mkdir -p ~/.agda
          echo "$GITHUB_WORKSPACE/agda-stdlib/standard-library.agda-lib" > ~/.agda/libraries
          echo "standard-library-2.3" > ~/.agda/defaults

      - name: Cache Agda build
        uses: actions/cache@v4
        with:
          path: |
            _build/
            agda-stdlib/_build/
          key: agda-stdlib23-${{ hashFiles('src/**/*.agda') }}
          restore-keys: agda-stdlib23-

      # Both developments are rendered: src/Recursive/ is the complete
      # result, src/Inductive/ the direct attempt discussed in the paper.
      - name: Generate HTML
        run: |
          agda --html --html-dir=html src/Recursive/Everything.agda
          agda --html --html-dir=html src/Inductive/Everything.agda

      - name: Generate index page
        run: |
          cd html
          cat > index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <title>MSCS1 — A canonical normal form theorem for the type theory of regular categories</title>
          <style>body{font-family:sans-serif;max-width:820px;margin:2em auto;padding:0 1em;line-height:1.5}
          a{color:#0366d6}li{margin:0.25em 0}h2{margin-top:1.5em}code{background:#f6f8fa;padding:0.1em 0.3em;border-radius:3px}</style>
          </head><body>
          <h1>A canonical normal form theorem for the type theory of regular categories</h1>
          <p>Browsable Agda sources accompanying the paper by Riccardo Borsetto and
          Maria Emilia Maietti. Checked with Agda 2.9.0 and agda-stdlib 2.3 under
          <code>--without-K</code>.</p>
          <h2><code>src/Recursive/</code> — the complete result</h2>
          <p>Tait-style logical relations; computability is a recursive function on type
          structure. 39 modules, every one <code>--safe</code>; no <code>TERMINATING</code>
          pragmas, no postulates, no holes.</p>
          <ul>
          HTMLEOF
          for f in Recursive.*.html; do
            mod="${f%.html}"
            echo "<li><a href=\"$f\">$mod</a></li>" >> index.html
          done
          cat >> index.html <<'HTMLEOF'
          </ul>
          <h2><code>src/Inductive/</code> — the direct attempt</h2>
          <p>The abandoned inductive-family encoding, kept for the contrast discussed in
          the paper: 21 modules, 18 <code>--safe</code>, two narrow
          <code>TERMINATING</code> pragmas in <code>CompTheorem</code>.</p>
          <ul>
          HTMLEOF
          for f in Inductive.*.html; do
            mod="${f%.html}"
            echo "<li><a href=\"$f\">$mod</a></li>" >> index.html
          done
          cat >> index.html <<'HTMLEOF'
          </ul>
          <hr><p><small>Generated by GitHub Actions from
          <a href="https://github.com/eapiova/MSCS1">eapiova/MSCS1</a>.</small></p>
          </body></html>
          HTMLEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
